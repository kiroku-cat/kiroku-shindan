<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 外部への通信をブラウザ側で禁止する設定（画像・フォント・通信・フォーム送信すべて不可） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>記録スタイル診断</title>
<style>
  :root {
    --navy: #22304A;
    --teal: #3E7C74;
    --bg: #F3F5F8;
    --surface: #FFFFFF;
    --text: #22304A;
    --muted: #5B6779;
    --border: #D8DEE7;
    --accent: #3E7C74;
    --accent-text: #FFFFFF;
    --accent-soft: #E4F0EE;
    --option-hover: #F0F5F4;
    --track: #DCE3EA;
    --note-bg: #F6F7FA;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111826;
      --surface: #1A2335;
      --text: #E7EBF1;
      --muted: #A5AFBF;
      --border: #2E3A52;
      --accent: #7CC0B5;
      --accent-text: #0F1E1C;
      --accent-soft: #1E3431;
      --option-hover: #22304A;
      --track: #2E3A52;
      --note-bg: #151D2C;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    font-size: 16px;
    line-height: 1.75;
    min-height: 100vh;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 20px;
  }
  h1, h2 {
    margin: 0 0 12px;
    line-height: 1.45;
    outline: none;
  }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.25rem; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 0.9rem; }

  .btn {
    display: block;
    width: 100%;
    min-height: 52px;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid transparent;
    font: inherit;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-secondary { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-text {
    background: none; border: none; color: var(--muted);
    font: inherit; font-size: 0.9rem; padding: 8px 0; cursor: pointer;
    text-decoration: underline;
  }
  .btn:focus-visible, .option:focus-visible, .btn-text:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .intro-mark {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 2px 12px;
    margin-bottom: 14px;
  }
  .start-actions { margin-top: 24px; }

  /* 進み具合 */
  .progress { margin-bottom: 20px; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; color: var(--muted); margin-bottom: 6px;
  }
  .track { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .bar { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }

  /* 選択肢 */
  .options { display: grid; gap: 12px; margin: 20px 0 8px; }
  .option {
    display: flex; gap: 12px; align-items: flex-start;
    width: 100%; text-align: left;
    padding: 14px 16px; min-height: 56px;
    background: var(--surface); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 12px;
    font: inherit; cursor: pointer;
  }
  .option:hover { background: var(--option-hover); }
  .option.selected { border-color: var(--accent); background: var(--accent-soft); }
  .option-key {
    flex: none;
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 0.85rem; font-weight: 700;
    background: var(--accent-soft); color: var(--accent);
    margin-top: 1px;
  }
  .option-body { display: block; }
  .option-label { display: block; font-weight: 700; }
  .option-note { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

        if (k === 'class') node.className = attrs[k];
        else if (k === 'text') node.textContent = attrs[k];
        else if (k === 'onclick') node.addEventListener('click', attrs[k]);
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function show(nodes) {
    app.textContent = '';
    nodes.forEach(function (n) { app.appendChild(n); });
    var heading = app.querySelector('h1, h2');
    if (heading) heading.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  function catIllust(type) {
    var cat = CATS[type];
    var x = cat.crop[0], y = cat.crop[1], w = cat.crop[2], h = cat.crop[3];
    var node = el('div', { class: 'result-illust', role: 'img', 'aria-label': cat.label });
    node.style.aspectRatio = w + ' / ' + h;
    node.style.backgroundSize = (CAT_SHEET.w / w * 100) + '% auto';
    node.style.backgroundPosition = (x / (CAT_SHEET.w - w) * 100) + '% ' + (y / (CAT_SHEET.h - h) * 100) + '%';
    (cat.bubbles || []).forEach(function (b) {
      var span = el('span', { class: 'illust-bubble', 'aria-hidden': 'true', text: b.text });
      span.style.left = ((b.x - x) / w * 100) + '%';
      span.style.top = ((b.y - y) / h * 100) + '%';
      node.appendChild(span);
    });
    return node;
  }

  function renderStart() {
    answers = {};
    step = 0;
    show([
      el('span', { class: 'intro-mark', text: '4つの質問・約1分' }),
      el('h1', { tabindex: '-1', text: 'あなたに合う記録スタイルは？' }),
      el('p', { text: '4つの質問で、あなたに合った記録の残し方が分かります。' }),
      el('p', { class: 'muted', text: '回答はどこにも保存されません。' }),
      el('div', { class: 'start-actions' }, [
        el('button', { type: 'button', class: 'btn btn-primary', text: '診断をはじめる', onclick: function () { renderQuestion(0); } })
      ])
    ]);
  }

  function renderQuestion(index) {
    step = index;
    var q = QUESTIONS[index];
    var total = QUESTIONS.length;
    var percent = Math.round((index / total) * 100);

    var options = q.options.map(function (opt) {
      var selected = answers[q.key] === opt.value;
      return el('button', {
        type: 'button',
        class: 'option' + (selected ? ' selected' : ''),
        'aria-pressed': selected ? 'true' : 'false',
        onclick: function () { choose(q.key, opt.value); }
      }, [
        el('span', { class: 'option-key', 'aria-hidden': 'true', text: opt.value }),
        el('span', { class: 'option-body' }, [
          el('span', { class: 'option-label', text: opt.label }),
          opt.note ? el('span', { class: 'option-note', text: opt.note }) : null
        ])
      ]);
    });

    show([
      el('div', { class: 'progress' }, [
        el('div', { class: 'progress-label' }, [
          el('span', { text: '質問 ' + (index + 1) + ' / ' + total }),
          el('span', { text: percent + '%' })
        ]),
        el('div', {
          class: 'track', role: 'progressbar',
          'aria-valuemin': '0', 'aria-valuemax': String(total), 'aria-valuenow': String(index),
          'aria-label': '進み具合'
        }, [el('div', { class: 'bar', style: 'width:' + percent + '%' })])
      ]),
      el('h2', { tabindex: '-1', text: 'Q' + (index + 1) + '. ' + q.text }),
      el('div', { class: 'options' }, options),
      index > 0
        ? el('button', { type: 'button', class: 'btn-text', text: '← 前の質問にもどる', onclick: function () { renderQuestion(index - 1); } })
        : el('button', { type: 'button', class: 'btn-text', text: '← はじめにもどる', onclick: renderStart })
    ]);
  }

  function choose(key, value) {
    answers[key] = value;
    if (step + 1 < QUESTIONS.length) renderQuestion(step + 1);
    else renderResult();
  }

  function judge(a) {
    var type;
    if (a.q4 === 'B') type = 'condition';
    else if (a.q1 === 'A') type = 'privacy';
    else if (a.q3 === 'A') type = 'advice';
    else type = 'simple';

    var extras = [];
    if (type === 'privacy' && a.q3 === 'A') extras.push(EXTRA.ai);
    if (a.q1 === 'B') extras.push(EXTRA.lock);
    if (a.q2 === 'B') extras.push(EXTRA.media);
    return { type: type, extras: extras };
  }

  function shareHref(typeName) {
    var url = SHARE_URL;
    if (!url && /^https?:$/.test(location.protocol)) {
      url = location.origin + location.pathname; // ? や # 以降は含めない
    }
    // 離婚を連想させる言葉は入れない（投稿は本人のフォロワーや家族の目にも触れるため）
    var params = 'text=' + encodeURIComponent('わたしの記録スタイルは「' + typeName + '」でした\n#記録スタイル診断');
    if (url) params += '&url=' + encodeURIComponent(url);
    return 'https://x.com/intent/tweet?' + params;
  }

  function isHttps(url) {
    return /^https:\/\//.test(url);
  }

  function linkButton(url, cls, label) {
    if (!isHttps(url)) return null;
    return el('a', { class: cls, href: url, target: '_blank', rel: 'noopener noreferrer', text: label });
  }

  function renderResult() {
    var r = judge(answers);
    var t = TYPES[r.type];
    answers = {}; // 結果を出したら回答はすぐ破棄する

    var nodes = [
      el('div', { class: 'progress' }, [
        el('div', { class: 'progress-label' }, [el('span', { text: '診断結果' }), el('span', { text: '100%' })]),
        el('div', { class: 'track', 'aria-hidden': 'true' }, [el('div', { class: 'bar', style: 'width:100%' })])
      ]),
      catIllust(r.type),
      el('p', { class: 'result-kicker', text: 'あなたにおすすめなのは' }),
      el('h2', { class: 'result-type', tabindex: '-1', text: t.name }),
      el('p', { text: t.lead }),
      el('p', { text: t.body }),
      el('div', { class: 'first-week' }, [
        el('p', { class: 'first-week-title', text: '最初の1週間は、これだけでOK' }),
        el('p', { text: t.firstWeek })
      ])
    ];

    if (r.extras.length) {
      nodes.push(el('p', { class: 'extras-title', text: 'あわせておすすめ' }));
      nodes.push(el('ul', { class: 'extras' }, r.extras.map(function (x) { return el('li', { text: x }); })));
    }

    nodes.push(el('div', { class: 'notes' }, [
      el('p', { text: '法律に関わる判断は弁護士に相談してください。' }),
      el('p', { text: 'この診断の回答は保存されていません。' })
    ]));

    nodes.push(el('div', { class: 'actions' }, [
      linkButton(NOTE_URL, 'btn btn-primary', '記録アプリを作っている話を読む'),
      linkButton(CHECKLIST_URL, 'btn btn-secondary', '記録項目リストを見る'),
      el('a', {
        class: 'btn ' + (isHttps(NOTE_URL) ? 'btn-secondary' : 'btn-primary'), href: shareHref(t.name),
        target: '_blank', rel: 'noopener noreferrer', text: 'Xで結果をシェア'
      }),
      r.type === 'privacy'
        ? el('p', { class: 'share-note', text: 'シェアするとXに投稿が残ります。見られる心配があるときは控えておきましょう。' })
        : null,
      el('button', { type: 'button', class: 'btn-text', text: 'もう一度診断する', onclick: renderStart })
    ]));

    show(nodes);
  }

  renderStart();
})();
</script>
</body>
</html>
